name: Build AMapClean

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show repo files
        run: ls -la

      - name: Decode sources from src.all
        run: python3 .github/decode.py

      - name: Check decoded result
        run: ls -la AmapClean/

      - name: Install Theos
        run: |
          export THEOS=$HOME/theos
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          git clone --recursive --depth 1 https://github.com/theos/theos.git $THEOS
          ls $THEOS | head

      - name: Install iOS SDK 15.6
        run: |
          set -e
          cd $THEOS
          mkdir -p sdks
          cd sdks
          curl -L --retry 3 --retry-delay 5 -o sdk.tar.gz \
            "https://github.com/theos/sdks/archive/refs/heads/master.tar.gz"
          tar xzf sdk.tar.gz
          mv sdks-master/*.sdk . 2>/dev/null || true
          rm -rf sdks-master sdk.tar.gz
          ls
          echo "=== SDK ready ==="

      - name: Build deb
        run: |
          cd AmapClean
          ls -la
          make package FINALPACKAGE=1 2>&1 | tail -80
          echo "=== deb files ==="
          find . -name "*.deb" -print
          ls -la packages/ 2>/dev/null || echo "no packages dir"

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AMapClean-deb
          path: AmapClean/packages/*.deb
          if-no-files-found: warn
