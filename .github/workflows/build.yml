name: Build AMapClean

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Check files
        run: |
          echo "=== repo root ==="
          ls -la
          echo "=== src.all exists? ==="
          if [ -f src.all ]; then
            echo "YES, size:"
            wc -c src.all
          else
            echo "NO - src.all NOT FOUND"
            find . -name "src.all"
          fi

      - name: Decode sources
        run: |
          python3 -c "
import re, base64, pathlib, sys
p = pathlib.Path('src.all')
if not p.exists():
    sys.exit('src.all not found')
text = p.read_text()
blocks = re.findall(r'=== FILE: (\S+) ===\n(.*?)\n=== END ===', text, re.S)
out = pathlib.Path('AmapClean')
out.mkdir(exist_ok=True)
for name, b64 in blocks:
    (out / name).write_bytes(base64.b64decode(b64.strip()))
    print('wrote', name)
print('total', len(blocks))
"
          echo "=== decoded ==="
          ls -la AmapClean/

      - name: Install Theos
        run: |
          export THEOS=$HOME/theos
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          git clone --recursive --depth 1 https://github.com/theos/theos.git $THEOS
          echo "=== theos installed ==="
          ls $THEOS | head

      - name: Install SDK
        run: |
          set -e
          cd $THEOS
          mkdir -p sdks
          curl -L --retry 3 -o sdks/sdk.tar.gz https://github.com/theos/sdks/raw/master/iPhoneOS16.5.sdk.tar.gz
          cd sdks
          tar xzf sdk.tar.gz
          rm -f sdk.tar.gz
          echo "=== sdks ==="
          ls

      - name: Build
        run: |
          cd AmapClean
          echo "=== files ==="
          ls -la
          echo "=== make ==="
          make package FINALPACKAGE=1 2>&1 | tail -60
          echo "=== looking for deb ==="
          find . -name "*.deb" -print
          ls -la packages/ 2>/dev/null || echo "no packages dir"

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AMapClean-build
          path: AmapClean/packages/*.deb
          if-no-files-found: warn
